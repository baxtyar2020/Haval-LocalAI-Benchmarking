document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

                <div style=\"font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);\">{{ v.segment }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-family:Fraunces,serif;font-size:20px;font-weight:600;margin-bottom:4px;\">{{ v.model }}<\u002Fdiv>\n                  <div style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:{{ v.matchBg }};color:{{ v.matchFg }};font-size:11.5px;font-weight:700;margin-bottom:14px;\">{{ v.match }}<\u002Fdiv>\n                  <p style=\"font-size:13px;line-height:20px;color:var(--ink-soft);margin:0;\">{{ v.why }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- matrix table -->\n            <div style=\"font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 14px 2px;\">Every tested model<\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(26,26,26,.04),0 6px 18px -8px rgba(26,26,26,.08);margin-bottom:30px;\">\n              <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;padding:14px 22px;background:var(--canvas);border-bottom:1px solid var(--border);font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);\">\n                <div>Model<\u002Fdiv><div style=\"text-align:center;\">Consumer<\u002Fdiv><div style=\"text-align:center;\">Gaming<\u002Fdiv><div style=\"text-align:center;\">Commercial<\u002Fdiv><div style=\"text-align:center;\">Overall<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ reportRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;align-items:center;padding:13px 22px;border-bottom:1px solid var(--border);background:{{ row.rowBg }};\">\n                  <div style=\"display:flex;align-items:center;gap:10px;\"><div style=\"width:30px;height:30px;border-radius:8px;background:var(--canvas);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:none;\"><i data-lucide=\"box\" style=\"width:15px;height:15px;\"><\u002Fi><\u002Fdiv><div><div style=\"font-size:14px;font-weight:600;color:var(--ink);\">{{ row.name }}<\u002Fdiv><div style=\"font-size:12px;color:var(--ink-soft);\">{{ row.size }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;justify-content:center;\"><span style=\"display:inline-flex;align-items:center;justify-content:center;padding:4px 11px;border-radius:999px;background:{{ cell.bg }};color:{{ cell.fg }};font-size:11.5px;font-weight:600;min-width:92px;text-align:center;\">{{ cell.label }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;\">\n              <div style=\"display:flex;align-items:center;gap:9px;background:var(--accent);color:var(--on-accent);padding:0 22px;height:44px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px -6px rgba(219,79,27,.5);\" style-hover=\"background:var(--accent-hover)\"><i data-lucide=\"download\" style=\"width:17px;height:17px;\"><\u002Fi>Export PDF<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--border);color:var(--ink);padding:0 22px;height:44px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;\" style-hover=\"background:var(--accent-soft);border-color:transparent;color:var(--accent-text)\"><i data-lucide=\"folder-open\" style=\"width:17px;height:17px;\"><\u002Fi>Show in folder<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- ============ SETTINGS ============ -->\n        <sc-if value=\"{{ isSettings }}\">\n        <div style=\"animation:hb-fade .32s ease both;max-width:820px;\">\n          <div style=\"font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent-text);font-weight:600;margin-bottom:10px;\">Settings<\u002Fdiv>\n          <h1 style=\"font-family:Fraunces,serif;font-size:30px;line-height:36px;font-weight:500;margin:0 0 26px;\">Preferences<\u002Fh1>\n          <sc-for list=\"{{ settingGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"margin-bottom:24px;\">\n              <div style=\"font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 12px 2px;\">{{ g.title }}<\u002Fdiv>\n              <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(26,26,26,.04);\">\n                <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--border);\">\n                    <div style=\"flex:1;\"><div style=\"font-size:14.5px;font-weight:600;color:var(--ink);\">{{ r.title }}<\u002Fdiv><div style=\"font-size:12.5px;color:var(--ink-soft);margin-top:2px;\">{{ r.sub }}<\u002Fdiv><\u002Fdiv>\n                    <sc-if value=\"{{ r.isToggle }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div sc-camel-on-click=\"{{ r.toggle }}\" style=\"width:44px;height:26px;border-radius:999px;background:{{ r.trackBg }};padding:3px;cursor:pointer;transition:background .18s ease;flex:none;\"><div style=\"width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transform:translateX({{ r.knobX }});transition:transform .18s ease;\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ r.isValue }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink);padding:7px 14px;border-radius:10px;background:var(--canvas);border:1px solid var(--border);cursor:pointer;\">{{ r.value }}<i data-lucide=\"chevron-down\" style=\"width:15px;height:15px;color:var(--ink-faint);\"><\u002Fi><\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'home',\n    repair: 'attention',      // attention | repairing | ready\n    showTech: false,\n    filter: 'Installed',\n    selected: { 'llama3.1:8b': true, 'qwen2.5:7b': true, 'phi3.5:3.8b': true, 'mistral:7b': true },\n    dl: { 'gemma2:9b': 32 },  // model -> pct\n    bench: 'running',         // idle | running | paused\n    benchPct: 47,\n    showLog: false,\n    report: 'list',           // list | detail\n    settings: { updates: true, telemetry: false, hideCmd: true, autoSelect: true, keepModels: true },\n  };\n\n  componentDidMount() {\n    this.iconify();\n    this.tick = setInterval(() => {\n      this.setState(s => {\n        let ns = {};\n        if (s.bench === 'running' && s.benchPct < 100) ns.benchPct = Math.min(100, s.benchPct + 1);\n        const dl = { ...s.dl }; let ch = false;\n        for (const k in dl) { if (dl[k] < 100) { dl[k] = Math.min(100, dl[k] + 3); ch = true; } }\n        if (ch) ns.dl = dl;\n        return ns;\n      });\n    }, 900);\n  }\n  componentWillUnmount() { clearInterval(this.tick); }\n  componentDidUpdate() { this.iconify(); }\n  iconify() { try { window.lucide && window.lucide.createIcons(); } catch(e){} }\n\n  set(k, v) { this.setState({ [k]: v }); }\n\n  renderVals() {\n    const s = this.state;\n    const C = getComputedStyle(document.documentElement);\n    // token helper via literals (kept in JS for status mapping)\n    const T = {\n      accent:'#DB4F1B', accentText:'#A83B15', accentSoft:'#F4DCD0', onAccent:'#F6F1E9',\n      ink:'#1A1A1A', inkSoft:'#4A4540', inkFaint:'#8A857D', border:'#E6DFD3',\n      surface:'#FBF7EF', surface2:'#FFFDF8', canvas:'#F6F1E9',\n      ok:'#287653', okBg:'#DDEDE5', warn:'#A76000', warnBg:'#F7E8C8',\n      err:'#B42318', errBg:'#F8DFDC', info:'#456A87', infoBg:'#E1EAF0', neu:'#625D57', neuBg:'#ECE6DD',\n    };\n\n    // ---- nav ----\n    const tabDefs = [\n      { id:'home', label:'Home', icon:'house' },\n      { id:'doctor', label:'Doctor', icon:'stethoscope' },\n      { id:'models', label:'Models', icon:'boxes' },\n      { id:'benchmark', label:'Benchmark', icon:'gauge' },\n      { id:'reports', label:'Reports', icon:'scroll-text' },\n      { id:'settings', label:'Settings', icon:'settings' },\n    ];\n    const tabs = tabDefs.map(t => {\n      const active = s.tab === t.id;\n      return { ...t,\n        weight: active ? 600 : 500,\n        color: active ? T.accentText : T.inkSoft,\n        bg: active ? T.accentSoft : 'transparent',\n        go: () => this.setState({ tab: t.id, report: 'list' }),\n      };\n    });\n\n    // ---- health pill ----\n    const healthy = s.repair === 'ready';\n    const health = healthy\n      ? { label:'Ready', bg:T.okBg, border:'transparent', dot:T.ok, halo:'rgba(40,118,83,.18)', fg:T.ok }\n      : s.repair === 'repairing'\n      ? { label:'Repairing', bg:T.accentSoft, border:'transparent', dot:T.accent, halo:'rgba(219,79,27,.18)', fg:T.accentText }\n      : { label:'Needs attention', bg:T.warnBg, border:'transparent', dot:T.warn, halo:'rgba(167,96,0,.18)', fg:T.warn };\n\n    // ---- home specs ----\n    const specs = [\n      { icon:'cpu', label:'Processor', value:'Ryzen 7 7800X3D' },\n      { icon:'square-chevron-up', label:'Graphics', value:'RTX 4070 · 12 GB' },\n      { icon:'memory-stick', label:'System memory', value:'32 GB DDR5' },\n      { icon:'zap', label:'Acceleration', value:'CUDA · verified' },\n      { icon:'hard-drive', label:'Storage free', value:'318 GB' },\n      { icon:'network', label:'Ollama', value:'v0.3.9 · running' },\n    ];\n\n    // ---- doctor ----\n    const ready = s.repair === 'ready';\n    const repairing = s.repair === 'repairing';\n    const doctor = ready\n      ? { title:'Everything is ready', subtitle:'All prerequisites are healthy. This PC is ready to benchmark local models.',\n          icon:'shield-check', iconBg:T.okBg, iconFg:T.ok, spin:'',\n          btnLabel:'Re-run checks', btnIcon:'refresh-cw', btnBg:T.surface2, btnFg:T.ink, btnCursor:'pointer', btnOpacity:1 }\n      : repairing\n      ? { title:'Repairing…', subtitle:'Fixing the Ollama service path and restarting the local API. This is safe and hidden.',\n          icon:'loader', iconBg:T.accentSoft, iconFg:T.accentText, spin:'animation:hb-spin 1s linear infinite;',\n          btnLabel:'Repairing', btnIcon:'loader', btnBg:T.accent, btnFg:T.onAccent, btnCursor:'default', btnOpacity:.75 }\n      : { title:'Needs attention', subtitle:'Two items need a quick fix before benchmarking. We can repair them automatically.',\n          icon:'shield-alert', iconBg:T.warnBg, iconFg:T.warn, spin:'',\n          btnLabel:'Repair Automatically', btnIcon:'wrench', btnBg:T.accent, btnFg:T.onAccent, btnCursor:'pointer', btnOpacity:1 };\n\n    const mk = (st) => ({\n      ok:{ bg:T.okBg, fg:T.ok, status:'Ready', icon:'check' },\n      warn:{ bg:T.warnBg, fg:T.warn, status:'Action', icon:'alert-triangle' },\n      err:{ bg:T.errBg, fg:T.err, status:'Blocked', icon:'x' },\n      busy:{ bg:T.accentSoft, fg:T.accentText, status:'Fixing', icon:'loader' },\n    }[st]);\n    const chk = (title, detail, st, action) => {\n      const m = mk(st);\n      return { title, detail, ...m, spin: st==='busy'?'animation:hb-spin 1s linear infinite;':'', hasAction: !!action, action: action||'' };\n    };\n    let checks;\n    if (ready) {\n      checks = [\n        chk('Runtime components','Visual C++ and .NET runtime present.','ok'),\n        chk('Ollama installed','v0.3.9 detected and on PATH.','ok'),\n        chk('Ollama service','Local API responding at 127.0.0.1:11434.','ok'),\n        chk('GPU acceleration','CUDA confirmed on RTX 4070 (12 GB).','ok'),\n        chk('Storage','318 GB free — enough for preferred models.','ok'),\n        chk('Live model test','tinyllama loaded and answered on GPU.','ok'),\n      ];\n    } else if (repairing) {\n      checks = [\n        chk('Runtime components','Visual C++ and .NET runtime present.','ok'),\n        chk('Ollama installed','v0.3.9 detected and on PATH.','ok'),\n        chk('Ollama service','Restarting service and reattaching PATH…','busy'),\n        chk('GPU acceleration','Re-probing CUDA driver…','busy'),\n        chk('Storage','318 GB free — enough for preferred models.','ok'),\n        chk('Live model test','Waiting for service.','ok'),\n      ];\n    } else {\n      checks = [\n        chk('Runtime components','Visual C++ and .NET runtime present.','ok'),\n        chk('Ollama installed','v0.3.9 detected and on PATH.','ok'),\n        chk('Ollama service','API not responding — service may be stopped.','warn','Repair'),\n        chk('GPU acceleration','Driver reports CUDA but last run fell back to CPU.','warn','Re-probe'),\n        chk('Storage','318 GB free — enough for preferred models.','ok'),\n        chk('Live model test','Runs after the service is healthy.','ok'),\n      ];\n    }\n    const techLog = 'ollama --version            0.3.9\\nGET  127.0.0.1:11434/api/tags   ECONNREFUSED\\nsc query ollama                 STATE: 1 STOPPED\\nnvidia-smi                      RTX 4070, driver 552.44, CUDA 12.4\\nlast_run.gpu_layers             0  (expected 33)';\n\n    // ---- models ----\n    const allModels = [\n      { key:'llama3.1:8b', name:'Llama 3.1', tag:'8B', params:'8.0B params', quant:'Q4_K_M', size:'4.7 GB', fit:'Excellent fit', fitLevel:'exc', st:'installed', pref:true },\n      { key:'qwen2.5:7b', name:'Qwen 2.5', tag:'7B', params:'7.6B params', quant:'Q4_K_M', size:'4.4 GB', fit:'Excellent fit', fitLevel:'exc', st:'installed', pref:true },\n      { key:'phi3.5:3.8b', name:'Phi 3.5', tag:'3.8B', params:'3.8B params', quant:'Q4_0', size:'2.2 GB', fit:'Excellent fit', fitLevel:'exc', st:'installed', pref:true },\n      { key:'mistral:7b', name:'Mistral', tag:'7B', params:'7.2B params', quant:'Q4_K_M', size:'4.1 GB', fit:'Strong fit', fitLevel:'str', st:'installed', pref:true },\n      { key:'gemma2:9b', name:'Gemma 2', tag:'9B', params:'9.2B params', quant:'Q4_K_M', size:'5.4 GB', fit:'Strong fit', fitLevel:'str', st:'available', pref:true },\n      { key:'llama3.1:13b', name:'Llama 3.1', tag:'13B', params:'13B params', quant:'Q4_K_M', size:'7.9 GB', fit:'Marginal — tight VRAM', fitLevel:'mar', st:'available', pref:true },\n      { key:'qwen2.5:14b', name:'Qwen 2.5', tag:'14B', params:'14.8B params', quant:'Q4_K_M', size:'9.0 GB', fit:'Marginal — tight VRAM', fitLevel:'mar', st:'available', pref:false },\n      { key:'mixtral:8x7b', name:'Mixtral', tag:'8x7B', params:'46.7B params', quant:'Q4_0', size:'26 GB', fit:'Not recommended', fitLevel:'no', st:'available', pref:false },\n    ];\n    const fitStyle = { exc:{bg:T.okBg,fg:T.ok,icon:'check-circle-2'}, str:{bg:T.infoBg,fg:T.info,icon:'circle-check'}, mar:{bg:T.warnBg,fg:T.warn,icon:'alert-triangle'}, no:{bg:T.neuBg,fg:T.neu,icon:'ban'} };\n    const filtered = allModels.filter(m => s.filter==='Installed' ? m.st==='installed' : s.filter==='Preferred' ? m.pref : true);\n    const modelRows = filtered.map(m => {\n      const sel = !!s.selected[m.key];\n      const pct = s.dl[m.key];\n      const downloading = pct != null && pct < 100;\n      const installed = m.st==='installed' || (pct != null && pct >= 100);\n      const available = m.st==='available' && !downloading && !installed;\n      const fs = fitStyle[m.fitLevel];\n      return { name:m.name, tag:m.tag, params:m.params, quant:m.quant, size:m.size, fit:m.fit,\n        fitBg:fs.bg, fitFg:fs.fg, fitIcon:fs.icon,\n        rowBg: sel ? T.accentSoft : 'transparent',\n        checkBg: sel ? T.accent : T.surface2, checkBorder: sel ? T.accent : T.border,\n        checkDisplay: sel ? 'block' : 'none',\n        toggle: () => this.setState(st => ({ selected: { ...st.selected, [m.key]: !st.selected[m.key] } })),\n        isDownloading: downloading, pct: pct, stage: pct < 60 ? 'Downloading' : 'Verifying',\n        isInstalled: installed, isAvailable: available,\n        download: () => this.setState(st => ({ dl: { ...st.dl, [m.key]: 3 } })),\n      };\n    });\n    const filters = ['Installed','Preferred','Search Ollama'].map(f => ({\n      label:f, go:()=>this.set('filter', f),\n      color: s.filter===f ? T.onAccent : T.inkSoft,\n      bg: s.filter===f ? T.accent : 'transparent',\n    }));\n\n    // ---- benchmark ----\n    const running = s.bench==='running', paused = s.bench==='paused', idle = s.bench==='idle';\n    const bench = {\n      running: running || paused, idle,\n      heading: idle ? 'Ready to benchmark' : running ? 'Benchmarking in progress' : 'Paused',\n      pauseIcon: paused ? 'play' : 'pause', pauseLabel: paused ? 'Resume' : 'Pause',\n      modelIndex: 3, modelTotal: 4, elapsed: '12:48', pct: s.benchPct,\n      current: running ? 'Qwen 2.5 7B — Commercial · Heavy workload' : paused ? 'Paused — Qwen 2.5 7B, Heavy workload' : 'Press Start to begin the sequence',\n      currentSub: running ? 'Structured output & JSON · persona 14 of 20' : paused ? 'Progress is saved. Resume when ready.' : '4 models selected · 20 personas each',\n      stepIcon: running ? 'loader' : paused ? 'pause' : 'flag',\n      stepSpin: running ? 'animation:hb-spin 1s linear infinite;' : '',\n    };\n    const benchStats = [\n      { label:'Generation speed', value:'42.6', unit:'tok/s', color:T.ink },\n      { label:'Time to first token', value:'0.31', unit:'s', color:T.ink },\n      { label:'VRAM headroom', value:'3.1', unit:'GB', color:T.ok },\n      { label:'Completion', value:'100', unit:'%', color:T.ok },\n    ];\n    const benchLog = '[14:22:07] load  qwen2.5:7b  gpu_layers=33  vram=5.9GB\\n[14:22:08] run   persona=commercial-analyst  workload=heavy\\n[14:22:09] ttft  0.31s   prompt_tokens=1284\\n[14:22:14] gen   42.6 tok/s  out_tokens=612\\n[14:22:14] eval  json_valid=true  instruction_follow=0.94';\n\n    // ---- reports ----\n    const reportCards = [\n      { date:'Aug 24, 2026', machine:'This PC · RTX 4070', title:'Desktop — 6 models, full sweep', models:6, best:'Llama 3.1 8B', tag:'Latest', g1:'#DB4F1B', g2:'#A83B15', open:()=>this.set('report','detail') },\n      { date:'Aug 11, 2026', machine:'Laptop · RTX 4060 (8 GB)', title:'Laptop — memory-constrained run', models:4, best:'Phi 3.5 3.8B', tag:'Archived', g1:'#7A8A5E', g2:'#5C6B45', open:()=>this.set('report','detail') },\n      { date:'Jul 29, 2026', machine:'Workstation · RTX 4090', title:'Workstation — high-capability sweep', models:8, best:'Qwen 2.5 14B', tag:'Archived', g1:'#456A87', g2:'#2F4C63', open:()=>this.set('report','detail') },\n      { date:'Jul 02, 2026', machine:'Mini PC · integrated', title:'Mini PC — small-model baseline', models:3, best:'Phi 3.5 3.8B', tag:'Archived', g1:'#A76000', g2:'#7A4700', open:()=>this.set('report','detail') },\n    ];\n    const ranges = [\n      { label:'Comfortable range', value:'3B – 9B', color:T.ok, note:'Fast, reliable, full GPU offload with headroom.' },\n      { label:'Best everyday balance', value:'Llama 3.1 8B', color:T.accentText, note:'Quality and speed both strong for daily work.' },\n      { label:'Ceiling before strain', value:'~13B', color:T.warn, note:'Runs, but VRAM-tight; heavy tasks slow down.' },\n    ];\n    const verdicts = [\n      { segment:'Consumer', icon:'user-round', iconBg:T.accentSoft, iconFg:T.accentText, model:'Phi 3.5 3.8B', match:'Excellent Match', matchBg:T.okBg, matchFg:T.ok, why:'Instant responses for everyday chat and writing with the lightest memory footprint.' },\n      { segment:'Gaming', icon:'gamepad-2', iconBg:T.accentSoft, iconFg:T.accentText, model:'Llama 3.1 8B', match:'Strong Match', matchBg:T.infoBg, matchFg:T.info, why:'Leaves plenty of VRAM for a game while still answering quickly in the background.' },\n      { segment:'Commercial', icon:'briefcase', iconBg:T.accentSoft, iconFg:T.accentText, model:'Qwen 2.5 7B', match:'Excellent Match', matchBg:T.okBg, matchFg:T.ok, why:'Best accuracy on coding, structured output and instruction following for real work.' },\n    ];\n    const cell = (level) => ({\n      exc:{label:'Excellent',bg:T.okBg,fg:T.ok},\n      str:{label:'Strong',bg:T.infoBg,fg:T.info},\n      acc:{label:'Acceptable',bg:T.accentSoft,fg:T.accentText},\n      mar:{label:'Marginal',bg:T.warnBg,fg:T.warn},\n      no:{label:'Not rec.',bg:T.neuBg,fg:T.neu},\n      fail:{label:'Failed',bg:T.errBg,fg:T.err},\n    }[level]);\n    const rr = (name, size, c, g, cm, o) => ({ name, size, cells:[cell(c),cell(g),cell(cm),cell(o)] });\n    const reportRowsRaw = [\n      rr('Phi 3.5 3.8B','2.2 GB · Q4_0','exc','str','acc','str'),\n      rr('Llama 3.1 8B','4.7 GB · Q4_K_M','str','exc','str','exc'),\n      rr('Qwen 2.5 7B','4.4 GB · Q4_K_M','str','str','exc','exc'),\n      rr('Mistral 7B','4.1 GB · Q4_K_M','acc','str','str','str'),\n      rr('Gemma 2 9B','5.4 GB · Q4_K_M','acc','mar','str','acc'),\n      rr('Llama 3.1 13B','7.9 GB · Q4_K_M','mar','no','mar','mar'),\n    ];\n    const reportRows = reportRowsRaw.map((r,i) => ({ ...r, rowBg: i%2 ? T.canvas : 'transparent' }));\n\n    // ---- settings ----\n    const tog = (key) => ({\n      isToggle:true, isValue:false,\n      trackBg: s.settings[key] ? T.accent : T.border,\n      knobX: s.settings[key] ? '18px' : '0px',\n      toggle: () => this.setState(st => ({ settings: { ...st.settings, [key]: !st.settings[key] } })),\n    });\n    const val = (v) => ({ isValue:true, isToggle:false, value:v });\n    const settingGroups = [\n      { title:'Application', rows:[\n        { title:'Check for updates automatically', sub:'Notify when a new version is available.', ...tog('updates') },\n        { title:'Theme', sub:'Light theme matched to the Haval identity.', ...val('Warm Light') },\n      ]},\n      { title:'Ollama', rows:[\n        { title:'Run technical steps hidden', sub:'Never flash PowerShell or command windows.', ...tog('hideCmd') },\n        { title:'API endpoint', sub:'Local service address for the model runtime.', ...val('127.0.0.1:11434') },\n      ]},\n      { title:'Models & storage', rows:[\n        { title:'Auto-select preferred models', sub:'Pre-tick Haval Preferred models that fit this PC.', ...tog('autoSelect') },\n        { title:'Keep models after benchmarking', sub:'Do not remove downloaded models automatically.', ...tog('keepModels') },\n        { title:'Download location', sub:'Where Ollama stores model weights.', ...val('D:\\\\ollama\\\\models') },\n      ]},\n      { title:'Privacy & support', rows:[\n        { title:'Share anonymous diagnostics', sub:'Help improve reliability. No prompts are ever sent.', ...tog('telemetry') },\n      ]},\n    ];\n\n    return {\n      activeTab: s.tab, tabs, health,\n      isHome: s.tab==='home', isDoctor: s.tab==='doctor', isModels: s.tab==='models',\n      isBench: s.tab==='benchmark', isReports: s.tab==='reports', isSettings: s.tab==='settings',\n      goBench:()=>this.set('tab','benchmark'), goDoctor:()=>this.set('tab','doctor'),\n      goModels:()=>this.set('tab','models'), goReports:()=>this.setState({tab:'reports',report:'list'}),\n      specs,\n      doctor, checks, techLog, showTech: s.showTech, techIcon: s.showTech?'chevron-down':'chevron-right',\n      toggleTech:()=>this.se
